<svg xmlns="http://www.w3.org/2000/svg" width="680" height="16" viewBox="0 0 680 16" role="img" aria-label="">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF">
        <animate attributeName="stop-color" values="#58A6FF;#9B6BFF;#2DD4BF;#58A6FF" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#9B6BFF">
        <animate attributeName="stop-color" values="#9B6BFF;#2DD4BF;#58A6FF;#9B6BFF" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#2DD4BF">
        <animate attributeName="stop-color" values="#2DD4BF;#58A6FF;#9B6BFF;#2DD4BF" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="4" width="680" height="8" rx="4" fill="url(#bar)">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="-180" y="4" width="180" height="8" rx="4" fill="url(#shine)">
    <animate attributeName="x" values="-180;680" dur="3.4s" repeatCount="indefinite"/>
  </rect>
</svg>

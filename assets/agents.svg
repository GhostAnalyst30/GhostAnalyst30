<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="520" height="72" viewBox="0 0 520 72" role="img" aria-label="">
  <defs>
    <path id="lane1" d="M86 36 H210"/>
    <path id="lane2" d="M246 36 H370"/>
  </defs>

  <use xlink:href="#lane1" href="#lane1" fill="none" stroke="#58A6FF" stroke-opacity="0.28" stroke-width="1.6"/>
  <use xlink:href="#lane2" href="#lane2" fill="none" stroke="#9B6BFF" stroke-opacity="0.28" stroke-width="1.6"/>

  <line x1="86" y1="36" x2="210" y2="36" stroke="#58A6FF" stroke-width="1.6" stroke-dasharray="10 16" stroke-opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="0;-26" dur="1.4s" repeatCount="indefinite"/>
  </line>
  <line x1="246" y1="36" x2="370" y2="36" stroke="#9B6BFF" stroke-width="1.6" stroke-dasharray="10 16" stroke-opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="0;-26" dur="1.4s" begin="0.4s" repeatCount="indefinite"/>
  </line>

  <circle r="4" fill="#2DD4BF">
    <animateMotion dur="2.2s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
      <mpath xlink:href="#lane1" href="#lane1"/>
    </animateMotion>
  </circle>
  <circle r="4" fill="#58A6FF">
    <animateMotion dur="2.2s" begin="0.5s" repeatCount="indefinite">
      <mpath xlink:href="#lane2" href="#lane2"/>
    </animateMotion>
  </circle>

  <circle cx="70" cy="36" r="11" fill="none" stroke="#58A6FF" stroke-opacity="0.35">
    <animate attributeName="r" values="10;14;10" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="228" cy="36" r="11" fill="none" stroke="#2DD4BF" stroke-opacity="0.35">
    <animate attributeName="r" values="10;14;10" dur="2.6s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.6s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="386" cy="36" r="11" fill="none" stroke="#9B6BFF" stroke-opacity="0.35">
    <animate attributeName="r" values="10;14;10" dur="2.6s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.6s" begin="0.8s" repeatCount="indefinite"/>
  </circle>

  <circle cx="70" cy="36" r="7" fill="#58A6FF"/>
  <circle cx="228" cy="36" r="7" fill="#2DD4BF"/>
  <circle cx="386" cy="36" r="7" fill="#9B6BFF"/>
  <circle cx="70" cy="36" r="2.4" fill="#FFFFFF" fill-opacity="0.85"/>
  <circle cx="228" cy="36" r="2.4" fill="#FFFFFF" fill-opacity="0.85"/>
  <circle cx="386" cy="36" r="2.4" fill="#FFFFFF" fill-opacity="0.85"/>
</svg>
